<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4254f"/>
      <stop offset="100%" stop-color="#ff86a5"/>
    </linearGradient>
  </defs>

  <!-- Fondo claro (light theme) -->
  <rect width="600" height="120" rx="12" fill="#fbfaf7" opacity="0"/>
  <!-- Fondo oscuro (dark theme) -->
  <rect width="600" height="120" rx="12" fill="#121211" opacity="0"/>

  <g>
    <!-- MARK (V) -->
    <path
      d="M70 18 L108 48 L32 48 Z"
      fill="none"
      stroke="url(#accent)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Nodo de neurona IA -->
    <circle cx="70" cy="28" r="6" fill="#b4254f"/>
    <circle cx="70" cy="28" r="3" fill="#ff86a5"/>
  </g>

  <!-- WORDMARK: Victor Velarde (Newsreader serif) -->
  <text
    x="130" y="48"
    font-family="'Newsreader', 'Iowan Old Style', Charter, Georgia, serif"
    font-weight="600"
    font-size="42"
    fill="#1c1b19"
    letter-spacing="0"
  >
    victor
  </text>
  <text
    x="131" y="76"
    font-family="'Newsreader', 'Iowan Old Style', Charter, Georgia, serif"
    font-weight="700"
    font-size="42"
    fill="#b4254f"
    letter-spacing="0.02em"
  >
    velarde
  </text>

  <!-- Etiqueta contextual -->
  <text
    x="130" y="108"
    font-family="'Newsreader', 'Iowan Old Style', Charter, Georgia, serif"
    font-weight="400"
    font-size="14"
    fill="#6b685f"
    letter-spacing="0.04em"
    text-transform="uppercase"
  >
    product engineer · building with ia
  </text>
</svg>
