<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="60">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo translúcido (opcional) -->
  <rect width="120" height="60" rx="10" fill="#0f0f0f" opacity="0.04"/>
  <rect width="120" height="60" rx="10" fill="#ffffff" opacity="0.04"/>

  <!-- Marcador ("V") -->
  <g filter="url(#soft)">
    <!-- V de Victor -->
    <path
      d="M60 10 L100 50 L20 50 Z"
      fill="none"
      stroke="url(#brand)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Nodo de IA -->
    <circle cx="60" cy="23" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="23" r="2.2" fill="#22d3ee"/>
    <!-- Rayos de la neurona -->
    <line x1="68" y1="30" x2="75" y2="21" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="52" y1="30" x2="45" y2="21" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text
    x="78" y="45"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#0f0f0f"
    letter-spacing="0"
  >
    victor
  </text>
  <text
    x="78" y="68"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#22d3ee"
    letter-spacing="0.5"
  >
    velarde
  </text>
</svg>
